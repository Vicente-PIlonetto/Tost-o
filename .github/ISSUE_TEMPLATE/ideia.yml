name: Sugerir uma ideia
description: Uma função nova ou uma melhoria.
labels: ["ideia"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema ela resolve
      description: Conte a situação do dia a dia em que você sentiu falta disso.
    validations:
      required: true
  - type: textarea
    id: ideia
    attributes:
      label: Como você imagina
      description: Descreva a ideia. Imagens ou exemplos de outros apps ajudam.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Parte do app
      options:
        - Início
        - Carteiras, cartão e vale
        - Extrato e gráficos
        - Contas e entradas fixas
        - Compras
        - Poupança
        - Ajustes e notificações
        - Outra
